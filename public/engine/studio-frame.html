<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a02835">
  <title>SketchTrude Studio</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/styles/studio.css">
</head>
<body>
  <div id="studio-mount"></div>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const projectId = params.get('project') || 'local';
      window.__SKETCHTRUDE_PROJECT_ID = projectId;

      if (projectId && projectId !== 'local') {
        try {
          const pres = await fetch('/api/projects/' + projectId, { credentials: 'same-origin' });
          if (pres.ok) {
            window.__SKETCHTRUDE_PROJECT_CONFIG = await pres.json();
          }
        } catch (_) { /* offline / unauthenticated — engine uses defaults */ }
      }

      const res = await fetch('/engine/studio-body.html', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('Failed to load studio UI');
      const html = await res.text();
      const mount = document.getElementById('studio-mount');
      mount.innerHTML = html;

      const logo = document.getElementById('logo');
      if (logo) logo.src = '/logo.png';

      const helpers = document.createElement('script');
      helpers.src = '/engine/studio-helpers.js';
      helpers.async = false;
      document.body.appendChild(helpers);

      const interaction = document.createElement('script');
      interaction.src = '/engine/interaction-core.js';
      interaction.async = false;
      document.body.appendChild(interaction);

      const script = document.createElement('script');
      script.src = '/engine/legacy-app.js';
      script.async = false;
      document.body.appendChild(script);
    })().catch((err) => {
      const mount = document.getElementById('studio-mount');
      if (mount) {
        mount.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#333;"><h2>Studio failed to load</h2><p>Please refresh or sign in again.</p></div>';
      }
      console.error('Studio boot failed:', err);
    });
  </script>
</body>
</html>
